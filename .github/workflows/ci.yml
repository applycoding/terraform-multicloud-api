name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
        working-directory: api

      - name: Unit tests
        run: python -m pytest
        working-directory: api

      - name: Build image
        run: docker build -t portfolio-api:ci api

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Install TFLint plugins
        run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: Validate and lint each module
        run: |
          set -euo pipefail
          mkdir -p "${TF_PLUGIN_CACHE_DIR}"
          mapfile -t dirs < <(find terraform -type d -name .terraform -prune -o -type f -name '*.tf' -print | xargs -n1 dirname | sort -u)
          for dir in "${dirs[@]}"; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color
            terraform -chdir="${dir}" validate -no-color
            tflint --chdir="${dir}" --config "${GITHUB_WORKSPACE}/.tflint.hcl"
            echo "::endgroup::"
          done

      - name: Security scan
        run: |
          python -m pip install "checkov==3.3.29"
          checkov -d terraform --framework terraform --compact --quiet --config-file .checkov.yaml
